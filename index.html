<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAVvLIŃSKI | Fotografia</title>
  <meta name="description" content="Profesjonalna fotografia — eventy, portret, produkt, ulica. Poznań i okolice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="images/cloud.jpg">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080808;
    --text: #f0ece6;
    --gold: #b8985e;
    --border: rgba(240,236,230,0.08);
  }

  html { scroll-behavior: smooth; overflow-x: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
    max-width: 100vw;
  }

  /* NAVIGATION */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 24px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.4s ease, padding 0.4s ease;
  }
  nav.scrolled {
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(12px);
    padding: 16px 48px;
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--text);
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }
  .nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 400;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    color: #ffffff !important;
    border: none !important;
    padding: 0;
    background: none !important;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .nav-cta:hover { color: var(--gold) !important; }

  /* HAMBURGER */
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
  }
  .hamburger span {
    display: block;
    width: 24px;
    height: 1px;
    background: var(--text);
    transition: transform 0.3s, opacity 0.3s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  /* MOBILE MENU */
  .mobile-menu {
    display: flex;
    position: fixed;
    inset: 0;
    background: rgba(8,8,8,0.97);
    z-index: 99;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-20px);
    transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
  }
  .mobile-menu.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .mobile-menu a {
    font-family: 'Lato', sans-serif;
    font-size: 20px;
    font-weight: 100;
    letter-spacing: 0.2em;
    color: var(--text);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .mobile-menu a:hover { color: var(--gold); }

  /* HERO */
  #hero {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    min-height: -webkit-fill-available;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-slides {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .hero-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  .hero-slide.active { opacity: 1; }
  .hero-slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    will-change: transform, opacity;
  }
  .hero-title {
    font-family: 'Lato', sans-serif;
    font-size: clamp(48px, 8vw, 140px);
    font-weight: 290;
    line-height: 1;
    letter-spacing: 0.30em;
    color: #ffffff;
    text-indent: 0.30em;
    text-shadow: 0px 0px 0px rgba(0,0,0,0.6);
  }
  .hero-tag {
    font-family: 'Lato', sans-serif;
    font-size: clamp(11px, 1.4vw, 38px);
    letter-spacing: 2.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    font-weight: 300;
    text-indent: 2.3em;
    text-shadow: 0.7px 0.7px 0px rgba(0,0,0,0.5);
  }
  .hero-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    cursor: pointer;
    padding: 20px 10px;
    transition: color 0.3s;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hero-arrow:hover { color: rgba(255,255,255,0.9); }
  .hero-arrow-left { left: 12px; }
  .hero-arrow-right { right: 12px; }

  /* O MNIE */
  #about {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .about-bg {
    position: absolute;
    inset: -30% 0;
    background-size: cover;
    background-position: center center;
    z-index: 0;
    will-change: transform;
  }
  .about-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1;
  }
  .about-content {
    position: relative;
    z-index: 2;
    text-align: right;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    padding-right: 5%;
    gap: 12px;
    width: 100%;
    will-change: transform, opacity;
  }
  .about-title {
    font-family: 'Lato', sans-serif;
    font-size: clamp(48px, 8vw, 140px);
    font-weight: 100;
    line-height: 1;
    letter-spacing: 0.30em;
    text-indent: 0.30em;
    color: #ffffff;
    text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .nav-links, .nav-cta-wrap { display: none; }
    .hamburger { display: flex; }
    nav { padding: 20px 24px; }
    nav.scrolled { padding: 14px 24px; }
    .nav-logo { font-size: 13px !important; }
    #hero { padding: 0; justify-content: center; align-items: center; }
    .hero-title { letter-spacing: 0.1em; font-size: clamp(29px, 10.8vw, 72px); font-weight: 300 !important; }
    .hero-tag { letter-spacing: 0.25em; font-size: 14px; }
  }
</style>
</head>
<body>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <a href="#about" onclick="smoothScroll(event,'about');closeMobile()">O mnie</a>
  <a href="#contact" onclick="smoothScroll(event,'contact');closeMobile()">Kontakt</a>
</div>

<!-- NAV -->
<nav id="nav">
  <a href="#hero" class="nav-logo">PAvVLIŃSKI</a>
  <ul class="nav-links">
    <li><a href="#about" onclick="smoothScroll(event,'about')">O mnie</a></li>
    <li class="nav-cta-wrap"><a href="#contact" onclick="smoothScroll(event,'contact')" class="nav-cta">Kontakt</a></li>
  </ul>
  <button class="hamburger" id="hamburger" onclick="toggleMobile()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="hero-slides">
    <div class="hero-slide active" style="background-image: url('images/cloud.jpg')"></div>
    <div class="hero-slide" style="background-image: url('images/flamengo.jpg')"></div>
    <div class="hero-slide" style="background-image: url('images/trawa.jpg')"></div>
    <div class="hero-slide" style="background-image: url('images/tatry.jpg')"></div>
    <div class="hero-slide" style="background-image: url('images/lightrays.jpg')"></div>
    <div class="hero-slide" style="background-image: url('images/gym.jpg')"></div>
  </div>
  <div class="hero-content">
    <h1 class="hero-title">PAvVLIŃSKI</h1>
    <p class="hero-tag">Fotografia</p>
  </div>
  <button class="hero-arrow hero-arrow-left" id="heroPrev" aria-label="Poprzednie zdjęcie">&#9664;</button>
  <button class="hero-arrow hero-arrow-right" id="heroNext" aria-label="Następne zdjęcie">&#9654;</button>
</section>

<!-- O MNIE -->
<section id="about">
  <div class="about-bg" style="background-image: url('images/pawlinski2.jpg');"></div>
  <div class="about-overlay"></div>
  <div class="about-content">
    <h2 class="about-title">O MNIE</h2>
  </div>
</section>

<script>
  // SLIDESHOW — pierwszy slajd ma klasę active już w HTML, więc zero czarnego ekranu
  const slides = document.querySelectorAll('.hero-slide');
  let currentSlide = 0;
  const SLIDE_DURATION = 5000;

  function goToSlide(index) {
    slides[currentSlide].classList.remove('active');
    currentSlide = (index + slides.length) % slides.length;
    slides[currentSlide].classList.add('active');
  }
  function nextSlide() { goToSlide(currentSlide + 1); }
  function prevSlide() { goToSlide(currentSlide - 1); }

  let slideTimer = setInterval(nextSlide, SLIDE_DURATION);
  function resetTimer() {
    clearInterval(slideTimer);
    slideTimer = setInterval(nextSlide, SLIDE_DURATION);
  }

  document.getElementById('heroNext').addEventListener('click', () => { nextSlide(); resetTimer(); });
  document.getElementById('heroPrev').addEventListener('click', () => { prevSlide(); resetTimer(); });

  // Swipe
  let touchStartX = 0;
  const heroEl = document.getElementById('hero');
  heroEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  heroEl.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) { diff > 0 ? nextSlide() : prevSlide(); resetTimer(); }
  }, { passive: true });

  // Smooth scroll
  function smoothScroll(e, id) {
    e.preventDefault();
    const target = document.getElementById(id);
    if (!target) return;
    const start = window.scrollY;
    const end = target.getBoundingClientRect().top + window.scrollY;
    const distance = end - start;
    const duration = 2400;
    let startTime = null;
    function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
    function step(timestamp) {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / duration, 1);
      window.scrollTo(0, start + distance * ease(progress));
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // Hero content — fadeUp przy wejściu
  const heroContent = document.querySelector('.hero-content');
  heroContent.style.opacity = '0';
  heroContent.style.transform = 'translateY(30px)';
  setTimeout(() => {
    heroContent.style.transition = 'opacity 1s ease, transform 1s ease';
    heroContent.style.opacity = '1';
    heroContent.style.transform = 'translateY(0px)';
    setTimeout(() => { heroContent.style.transition = 'none'; }, 1000);
  }, 500);

  // Referencje
  const aboutBg = document.querySelector('.about-bg');
  const aboutContent = document.querySelector('.about-content');
  const nav = document.getElementById('nav');
  let ticking = false;

  // Główny scroll listener
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        const scrollY = window.scrollY;

        // Nav
        nav.classList.toggle('scrolled', scrollY > 60);

        // Hero parallax logo — zanika i przesuwa się w górę
        const heroH = document.getElementById('hero').offsetHeight;
        const progress = scrollY / (heroH * 0.45);
        heroContent.style.opacity = Math.max(0, 1 - progress);
        heroContent.style.transform = `translateY(${scrollY * 0.55}px)`;

        // O mnie — tło parallax
        if (aboutBg) {
          const aboutRect = document.getElementById('about').getBoundingClientRect();
          if (aboutRect.bottom > 0 && aboutRect.top < window.innerHeight) {
            aboutBg.style.transform = `translateY(${(-aboutRect.top) * 0.3}px)`;
          }
        }

        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });

  // Touch parallax (mobile)
  document.addEventListener('touchmove', () => {
    if (aboutBg) {
      const aboutEl = document.getElementById('about');
      if (aboutEl) {
        const aboutRect = aboutEl.getBoundingClientRect();
        if (aboutRect.bottom > 0 && aboutRect.top < window.innerHeight) {
          aboutBg.style.transform = `translateY(${(-aboutRect.top) * 0.3}px)`;
        }
      }
    }
  }, { passive: true });

  // Mobile menu
  function toggleMobile() {
    document.getElementById('mobileMenu').classList.toggle('open');
    document.getElementById('hamburger').classList.toggle('open');
  }
  function closeMobile() {
    document.getElementById('mobileMenu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  }
</script>
</body>
</html>
