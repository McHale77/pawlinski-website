<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAvVLIŃSKI | Fotografia</title>
  <meta name="description" content="Profesjonalna fotografia — eventy, portret, produkt, ulica. Poznań i okolice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;300;400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="images/cloud.jpg">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080808;
    --text: #f0ece6;
    --gold: #b8985e;
    --border: rgba(240,236,230,0.08);
  }

  html { scroll-behavior: smooth; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
    max-width: 100vw;
  }

  /* ================ NAVIGATION ================ */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 200;
    padding: 24px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.4s ease, padding 0.4s ease;
  }
  nav.scrolled {
    background: rgba(8,8,8,0.92);
    backdrop-filter: blur(12px);
    padding: 16px 48px;
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'Lato', sans-serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.35em;
    color: var(--text);
    text-decoration: none;
  }
  .nav-links { display: flex; gap: 40px; list-style: none; }
  .nav-links a {
    color: #ffffff;
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 400;
    transition: color 0.3s;
  }
  .nav-links a:hover { color: var(--gold); }
  .nav-cta {
    color: #ffffff !important;
    border: none !important;
    padding: 0;
    background: none !important;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .nav-cta:hover { color: var(--gold) !important; }

  /* HAMBURGER */
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
  }
  .hamburger span {
    display: block;
    width: 24px;
    height: 1px;
    background: var(--text);
    transition: transform 0.3s, opacity 0.3s;
  }
  .hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

  /* MOBILE MENU */
  .mobile-menu {
    display: flex;
    position: fixed;
    inset: 0;
    background: rgba(8,8,8,0.97);
    z-index: 199;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-20px);
    transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
  }
  .mobile-menu.open { opacity: 1; visibility: visible; transform: translateY(0); }
  .mobile-menu a {
    font-family: 'Lato', sans-serif;
    font-size: 20px;
    font-weight: 100;
    letter-spacing: 0.2em;
    color: var(--text);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.3s;
  }
  .mobile-menu a:hover { color: var(--gold); }

  /* ================ STACK ARCHITECTURE ================
     KAŻDA sekcja jest sticky top:0 i wypełnia 100vh.
     Wszystkie mają to samo top, więc nakładają się.
     Stacking wymuszamy przez z-index, treść animujemy w JS.
  ================================================ */
  .stack-wrap {
    position: relative;
    isolation: isolate;
    /* WYSOKOŚĆ = liczba sekcji × 100vh. 4 sekcje = 400vh */
    height: 400vh;
  }

  .stack-section {
    position: sticky;
    top: 0;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* WAŻNE: GPU acceleration */
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  /* Z-INDEX:
     Hero (40) i Portfolio (40) są ZAWSZE na wierzchu.
     About (20) i Contact (10) wychodzą spod nich. */
  #hero      { z-index: 40; }
  #about     { z-index: 20; }
  #portfolio { z-index: 30; }   /* nad About */
  #contact   { z-index: 10; }   /* pod wszystkim */

  /* Pełnoekranowe ciemne tło zabezpieczające — każda sekcja ma swoje */
  .section-fallback-bg {
    position: absolute;
    inset: 0;
    background: #080808;
    z-index: -1;
  }

  /* ================ HERO ================ */
  .hero-slides { position: absolute; inset: 0; z-index: 0; }
  .hero-slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
    will-change: opacity;
  }
  .hero-slide.active { opacity: 1; }
  .hero-slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
  }
  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    will-change: transform, opacity;
  }
  .hero-title {
    font-family: 'Lato', sans-serif;
    font-size: clamp(48px, 8vw, 140px);
    font-weight: 290;
    line-height: 1;
    letter-spacing: 0.30em;
    color: #ffffff;
    text-indent: 0.30em;
    text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
  }
  .hero-tag {
    font-family: 'Lato', sans-serif;
    font-size: clamp(11px, 1.4vw, 38px);
    letter-spacing: 2.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    font-weight: 300;
    text-indent: 2.3em;
    text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
  }
  .hero-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    background: none;
    border: none;
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    cursor: pointer;
    padding: 20px 10px;
    transition: color 0.3s;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hero-arrow:hover { color: rgba(255,255,255,0.9); }
  .hero-arrow-left { left: 12px; }
  .hero-arrow-right { right: 12px; }

  /* ================ WSPÓLNE STYLE TŁA I TYTUŁU ================ */
  .section-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center center;
    will-change: transform;
    transform: translate3d(0,0,0);
  }
  .section-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
  }
  .section-content {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform, opacity;
    transform: translate3d(0,0,0);
  }
  .section-title {
    font-family: 'Lato', sans-serif;
    font-size: clamp(48px, 8vw, 140px);
    font-weight: 100;
    line-height: 1;
    letter-spacing: 0.30em;
    text-indent: 0.30em;
    color: #ffffff;
    text-shadow: 0px 2px 4px rgba(0,0,0,0.5);
  }

  /* O MNIE — tytuł po prawej */
  .about-content {
    text-align: right;
    align-items: flex-end;
    padding-right: 5%;
    width: 100%;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .nav-links, .nav-cta-wrap { display: none; }
    .hamburger { display: flex; }
    nav { padding: 20px 24px; }
    nav.scrolled { padding: 14px 24px; }
    .nav-logo { font-size: 13px !important; }
    .hero-title { letter-spacing: 0.1em; font-size: clamp(29px, 10.8vw, 72px); font-weight: 300 !important; }
    .hero-tag { letter-spacing: 0.25em; font-size: 14px; }
    .section-title { letter-spacing: 0.1em; font-size: clamp(29px, 10.8vw, 72px); }
    .about-content { padding-right: 5%; }
  }
</style>
</head>
<body>

<!-- MOBILE MENU -->
<div class="mobile-menu" id="mobileMenu">
  <a href="#portfolio" onclick="smoothScroll(event,'portfolio');closeMobile()">Portfolio</a>
  <a href="#about" onclick="smoothScroll(event,'about');closeMobile()">O mnie</a>
  <a href="#contact" onclick="smoothScroll(event,'contact');closeMobile()">Kontakt</a>
</div>

<!-- NAV -->
<nav id="nav">
  <a href="#hero" class="nav-logo">PAvVLIŃSKI</a>
  <ul class="nav-links">
    <li><a href="#portfolio" onclick="smoothScroll(event,'portfolio')">Portfolio</a></li>
    <li><a href="#about" onclick="smoothScroll(event,'about')">O mnie</a></li>
    <li class="nav-cta-wrap"><a href="#contact" onclick="smoothScroll(event,'contact')" class="nav-cta">Kontakt</a></li>
  </ul>
  <button class="hamburger" id="hamburger" onclick="toggleMobile()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="stack-wrap">

  <!-- HERO — sekcja 1 -->
  <section id="hero" class="stack-section">
    <div class="section-fallback-bg"></div>
    <div class="hero-slides">
      <div class="hero-slide active" style="background-image: url('images/cloud.jpg')"></div>
      <div class="hero-slide" style="background-image: url('images/flamengo.jpg')"></div>
      <div class="hero-slide" style="background-image: url('images/trawa.jpg')"></div>
      <div class="hero-slide" style="background-image: url('images/tatry.jpg')"></div>
      <div class="hero-slide" style="background-image: url('images/lightrays.jpg')"></div>
      <div class="hero-slide" style="background-image: url('images/gym.jpg')"></div>
    </div>
    <div class="hero-content" id="heroContent">
      <h1 class="hero-title">PAvVLIŃSKI</h1>
      <p class="hero-tag">Fotografia</p>
    </div>
    <button class="hero-arrow hero-arrow-left" id="heroPrev" aria-label="Poprzednie">&#9664;</button>
    <button class="hero-arrow hero-arrow-right" id="heroNext" aria-label="Następne">&#9654;</button>
  </section>

  <!-- O MNIE — sekcja 2, pod Hero i Portfolio -->
  <section id="about" class="stack-section">
    <div class="section-fallback-bg"></div>
    <div class="section-bg" id="aboutBg" style="background-image: url('images/pawlinski2.jpg');"></div>
    <div class="section-overlay"></div>
    <div class="section-content about-content" id="aboutContent">
      <h2 class="section-title">O MNIE</h2>
    </div>
  </section>

  <!-- PORTFOLIO — sekcja 3, nad About -->
  <section id="portfolio" class="stack-section">
    <div class="section-fallback-bg"></div>
    <div class="section-bg" id="portfolioBg" style="background-image: url('images/portfolio2.jpg');"></div>
    <div class="section-overlay"></div>
    <div class="section-content" id="portfolioContent">
      <h2 class="section-title">PORTFOLIO</h2>
    </div>
  </section>

  <!-- KONTAKT — sekcja 4, pod wszystkim -->
  <section id="contact" class="stack-section">
    <div class="section-fallback-bg"></div>
    <div class="section-bg" id="contactBg" style="background-image: url('images/kontakt.jpg');"></div>
    <div class="section-overlay"></div>
    <div class="section-content" id="contactContent">
      <h2 class="section-title">KONTAKT</h2>
    </div>
  </section>

</div>

<script>
  // ─── SLIDESHOW ───────────────────────────────────────────────
  const slides = document.querySelectorAll('.hero-slide');
  let currentSlide = 0;
  const SLIDE_DURATION = 5000;

  function goToSlide(index) {
    slides[currentSlide].classList.remove('active');
    currentSlide = (index + slides.length) % slides.length;
    slides[currentSlide].classList.add('active');
  }
  function nextSlide() { goToSlide(currentSlide + 1); }
  function prevSlide() { goToSlide(currentSlide - 1); }

  let slideTimer = setInterval(nextSlide, SLIDE_DURATION);
  function resetTimer() {
    clearInterval(slideTimer);
    slideTimer = setInterval(nextSlide, SLIDE_DURATION);
  }

  document.getElementById('heroNext').addEventListener('click', () => { nextSlide(); resetTimer(); });
  document.getElementById('heroPrev').addEventListener('click', () => { prevSlide(); resetTimer(); });

  // Swipe
  let touchStartX = 0;
  const heroEl = document.getElementById('hero');
  heroEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  heroEl.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) { diff > 0 ? nextSlide() : prevSlide(); resetTimer(); }
  }, { passive: true });

  // ─── SMOOTH SCROLL ───────────────────────────────────────────
function smoothScroll(e, id) {
  e.preventDefault();
  const target = document.getElementById(id);
  if (!target) return;
  // Wyłączamy natywny smooth scroll żeby nie kolidował
  document.documentElement.style.scrollBehavior = 'auto';
  const start = window.scrollY;
  const end = target.getBoundingClientRect().top + window.scrollY;
  const distance = end - start;
  const duration = 1000;
  let startTime = null;
  function ease(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
  function step(ts) {
    if (!startTime) startTime = ts;
    const p = Math.min((ts - startTime) / duration, 1);
    window.scrollTo(0, start + distance * ease(p));
    if (p < 1) {
      requestAnimationFrame(step);
    } else {
      // Przywracamy natywny smooth scroll po animacji
      document.documentElement.style.scrollBehavior = '';
    }
  }
  requestAnimationFrame(step);
}

  // ─── REFERENCJE ──────────────────────────────────────────────
  const nav              = document.getElementById('nav');
  const heroContent      = document.getElementById('heroContent');
  const aboutBg          = document.getElementById('aboutBg');
  const aboutContent     = document.getElementById('aboutContent');
  const portfolioBg      = document.getElementById('portfolioBg');
  const portfolioContent = document.getElementById('portfolioContent');
  const contactBg        = document.getElementById('contactBg');
  const contactContent   = document.getElementById('contactContent');

  // Indeksy sekcji w stack (0=hero, 1=about, 2=portfolio, 3=contact)
  // Każda sekcja "aktywuje się" gdy scrollY przekracza jej_indeks * vh
  let ticking = false;

  function updateParallax() {
    const scrollY = window.scrollY;
    const vH = window.innerHeight;

    // Nav
    nav.classList.toggle('scrolled', scrollY > 60);

    // ── HERO (sekcja 0) ──
    // Aktywna w zakresie 0 → 1×vh
    // progress 0 = na wierzchu, 1 = za chwilę zniknie
    {
      const progress = Math.min(1, scrollY / vH);
      // Tytuł: paralaksa wolniejsza niż scroll + zanika
      heroContent.style.opacity = 1 - progress * 1.4;
      heroContent.style.transform = `translate3d(0, ${progress * vH * 0.4}px, 0)`;
    }

    // ── ABOUT (sekcja 1) ──
    // Aktywna w zakresie 1×vh → 2×vh
    {
      const localScroll = scrollY - vH;
      const progress = Math.max(-1, Math.min(1, localScroll / vH));
      // Tytuł porusza się paralaksą (wolniej niż scroll) i zanika
      // Przy progress = -1 jeszcze ukryty pod hero, =0 w środku, =1 wychodzi
      if (progress > -1 && progress < 1) {
        const fadeProgress = Math.abs(progress);
        const opacity = Math.max(0, 1 - fadeProgress * 1.4);
        aboutContent.style.opacity = opacity;
        aboutContent.style.transform = `translate3d(0, ${progress * vH * 0.4}px, 0)`;
        // Tło paralaksą wolniej
        aboutBg.style.transform = `translate3d(0, ${progress * vH * 0.15}px, 0)`;
      }
    }

    // ── PORTFOLIO (sekcja 2) ──
    // Aktywna w zakresie 2×vh → 3×vh
    {
      const localScroll = scrollY - vH * 2;
      const progress = Math.max(-1, Math.min(1, localScroll / vH));
      if (progress > -1 && progress < 1) {
        const fadeProgress = Math.abs(progress);
        const opacity = Math.max(0, 1 - fadeProgress * 1.4);
        portfolioContent.style.opacity = opacity;
        portfolioContent.style.transform = `translate3d(0, ${progress * vH * 0.4}px, 0)`;
      }
    }

    // ── KONTAKT (sekcja 3) ──
    // Aktywna w zakresie 3×vh → 4×vh
    {
      const localScroll = scrollY - vH * 3;
      const progress = Math.max(-1, Math.min(1, localScroll / vH));
      if (progress > -1 && progress < 1) {
        const fadeProgress = Math.abs(progress);
        const opacity = Math.max(0, 1 - fadeProgress * 1.4);
        contactContent.style.opacity = opacity;
        contactContent.style.transform = `translate3d(0, ${progress * vH * 0.4}px, 0)`;
        contactBg.style.transform = `translate3d(0, ${progress * vH * 0.15}px, 0)`;
      }
    }

    ticking = false;
  }

  // Inicjalizacja początkowych pozycji (żeby About/Portfolio/Contact nie pokazywały się przed scrollem)
  function initParallax() {
    aboutContent.style.opacity = '0';
    aboutContent.style.transform = `translate3d(0, ${-window.innerHeight * 0.4}px, 0)`;
    portfolioContent.style.opacity = '0';
    portfolioContent.style.transform = `translate3d(0, ${-window.innerHeight * 0.4}px, 0)`;
    contactContent.style.opacity = '0';
    contactContent.style.transform = `translate3d(0, ${-window.innerHeight * 0.4}px, 0)`;
    updateParallax();
  }
  initParallax();
  window.addEventListener('resize', initParallax);

  // Hero fadeUp przy starcie
  heroContent.style.opacity = '0';
  heroContent.style.transform = 'translate3d(0, 30px, 0)';
  setTimeout(() => {
    heroContent.style.transition = 'opacity 1s ease, transform 1s ease';
    heroContent.style.opacity = '1';
    heroContent.style.transform = 'translate3d(0, 0, 0)';
    setTimeout(() => { heroContent.style.transition = 'none'; }, 1100);
  }, 300);

  // Scroll listener
  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(updateParallax);
      ticking = true;
    }
  }, { passive: true });

  // Touch (mobile) — wymuś update także podczas touchmove
  document.addEventListener('touchmove', () => {
    if (!ticking) {
      requestAnimationFrame(updateParallax);
      ticking = true;
    }
  }, { passive: true });

  // ─── MOBILE MENU ─────────────────────────────────────────────
  function toggleMobile() {
    document.getElementById('mobileMenu').classList.toggle('open');
    document.getElementById('hamburger').classList.toggle('open');
  }
  function closeMobile() {
    document.getElementById('mobileMenu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  }
</script>
</body>
</html>
